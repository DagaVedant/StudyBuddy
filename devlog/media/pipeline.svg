<text x="40" y="76" font-family="Segoe UI,system-ui,sans-serif" font-size="15" fill="#6b5f77">Every step runs on hardware I already own. No API bills.</text><rect x="40" y="118" width="172" height="140" rx="14" fill="#e8dff0"/><text x="56" y="150" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#2b2036">Upload</text><text x="56" y="176" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">PDF or photo</text><text x="56" y="196" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">never leaves</text><text x="56" y="216" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">the browser</text><path d="M 218 188 L 233 188" stroke="#6b5f77" stroke-width="2"/><path d="M 233 188 l -5 -4 l 0 8 z" fill="#6b5f77"/><rect x="242" y="118" width="172" height="140" rx="14" fill="#dfeaf2"/><text x="258" y="150" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#2b2036">Rasterize + OCR</text><text x="258" y="176" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">pdf.js at 150 DPI</text><text x="258" y="196" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">Tesseract text layer</text><path d="M 420 188 L 435 188" stroke="#6b5f77" stroke-width="2"/><path d="M 435 188 l -5 -4 l 0 8 z" fill="#6b5f77"/><rect x="444" y="118" width="172" height="140" rx="14" fill="#e6f0e4"/><text x="460" y="150" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#2b2036">Extract</text><text x="460" y="176" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">qwen2.5vl:7b</text><text x="460" y="196" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">on my own GPU</text><text x="460" y="216" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">7.8s / page</text><path d="M 622 188 L 637 188" stroke="#6b5f77" stroke-width="2"/><path d="M 637 188 l -5 -4 l 0 8 z" fill="#6b5f77"/><rect x="646" y="118" width="172" height="140" rx="14" fill="#f7e6dc"/><text x="662" y="150" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#2b2036">Verify</text><text x="662" y="176" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">dedupe, audit,</text><text x="662" y="196" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">re-read what</text><text x="662" y="216" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">looks broken</text><path d="M 824 188 L 839 188" stroke="#6b5f77" stroke-width="2"/><path d="M 839 188 l -5 -4 l 0 8 z" fill="#6b5f77"/><rect x="848" y="118" width="172" height="140" rx="14" fill="#efe3f2"/><text x="864" y="150" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#2b2036">Study</text><text x="864" y="176" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">mark answers</text><text x="864" y="196" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">FSRS schedules</text><text x="864" y="216" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">the next review</text><text x="40" y="332" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#e0632c">114</text><text x="40" y="356" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">questions off a 58-page paper</text><text x="292" y="332" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#e0632c">99.1%</text><text x="292" y="356" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">found by the winning model</text><text x="544" y="332" font-family="Segoe UI,system-ui,sans-serif" font-size="30" font-weight="700" fill="#e0632c">303</text><text x="544" y="356" font-family="Segoe UI,system-ui,sans-serif" font-size="13" fill="#6b5f77">tests passing</text><te