services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile
    env_file: .env
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
